# Run with: --spring.profiles.active=mysql
# Uses an existing MySQL database (see scripts/configure-mysql.sql).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adventure}
spring.datasource.username=${DB_USER:kemot}
spring.datasource.password=${DB_PASSWORD:kemot}
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false

# Data already present in MySQL - do not import the txt files again
game.bootstrap.enabled=false
