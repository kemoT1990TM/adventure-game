server.port=8081

# MongoDB connection. Override with environment variables, e.g.
#   MONGO_HOST=mongodb (Kubernetes service), MONGO_HOST=192.168.94.49 (VM)
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}

