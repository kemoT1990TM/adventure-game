# Default: in-memory H2 database, schema created by Hibernate and filled
# from locations_79.txt / directions_79.txt / items_79.txt by AdventureBootStrap.
spring.datasource.url=jdbc:h2:mem:adventure;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=true

game.bootstrap.enabled=true
